<svg xmlns="http://www.w3.org/2000/svg" width="340" height="790" viewBox="0 0 340 790" role="img" aria-labelledby="title desc"><title id="title">Shell、Python与脚本：窄屏关系图</title><desc id="desc">终端窗口容纳Shell；Shell启动选中的Python解释器，解释器执行指定脚本。cwd是相对路径的解析起点。直接指定环境Python也可运行；激活后仍需核对真实解释器。版本相同不证明环境相同。</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#85b9ee"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#85b9ee"/></marker></defs><rect width="340" height="790" rx="18" fill="#0c1529"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="10" y="10" width="300" height="172" rx="14" fill="#111d35" stroke="#688fc2" stroke-width="2"/><text x="160" y="42" text-anchor="middle" font-size="23" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">终端窗口</text><rect x="25" y="58" width="270" height="48" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="160" y="92" text-anchor="middle" font-size="22" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">Shell：解释命令</text><rect x="25" y="117" width="270" height="48" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="160" y="151" text-anchor="middle" font-size="22" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">cwd：当前目录</text><path d="M160 187 V238" fill="none" stroke="#85b9ee" stroke-width="3" marker-end="url(#head)"/><rect x="37" y="198" width="246" height="28" rx="14" fill="#0c1529" stroke="#0c1529" stroke-width="2"/><text x="160" y="218" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">Shell启动Python</text><rect x="10" y="245" width="300" height="140" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="160" y="279" text-anchor="middle" font-size="22" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">本次Python解释器</text><text x="160" y="314" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">路径决定所用环境</text><text x="160" y="344" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">可直接调用环境Python</text><text x="160" y="374" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">激活后也要核对身份</text><path d="M160 391 V435" fill="none" stroke="#85b9ee" stroke-width="3" marker-end="url(#head)"/><rect x="65" y="398" width="190" height="27" rx="14" fill="#0c1529" stroke="#0c1529" stroke-width="2"/><text x="160" y="419" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">解释器执行</text><rect x="10" y="445" width="300" height="116" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="160" y="479" text-anchor="middle" font-size="22" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">指定的.py文件</text><text x="160" y="514" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">相对脚本路径从cwd解析</text><text x="160" y="544" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">源码在环境目录外</text><path d="M302 142 H327 V428 H285 V438" fill="none" stroke="#85b9ee" stroke-width="3" marker-end="url(#head)"/><text x="261" y="594" text-anchor="middle" font-size="19" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">cwd定位相对路径</text><rect x="10" y="605" width="300" height="150" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="160" y="639" text-anchor="middle" font-size="22" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">核对依据</text><text x="160" y="674" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">Interpreter / Environment</text><text x="160" y="704" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">应属于目标项目.venv</text><text x="160" y="734" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">相同版本仍可不同环境</text></g></svg>
