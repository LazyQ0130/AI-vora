<svg xmlns="http://www.w3.org/2000/svg" width="820" height="590" viewBox="0 0 820 590" role="img" aria-labelledby="title desc"><title id="title">Shell、Python与脚本的执行关系</title><desc id="desc">终端窗口容纳Shell；Shell启动选中的Python解释器，解释器执行指定脚本。cwd是相对路径的解析起点。直接指定环境Python也可运行；激活后仍需核对真实解释器。版本相同不证明环境相同。</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#85b9ee"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#85b9ee"/></marker></defs><rect width="820" height="590" rx="18" fill="#0c1529"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="30" y="20" width="760" height="135" rx="14" fill="#111d35" stroke="#688fc2" stroke-width="2"/><text x="410" y="52" text-anchor="middle" font-size="24" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">终端窗口</text><rect x="55" y="70" width="350" height="65" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="230" y="104" text-anchor="middle" font-size="22" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">Shell：解释命令</text><rect x="460" y="70" width="295" height="65" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="607.5" y="104" text-anchor="middle" font-size="22" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">cwd：当前目录</text><path d="M230 145 V235" fill="none" stroke="#85b9ee" stroke-width="3" marker-end="url(#head)"/><text x="232" y="183" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">启动</text><text x="232" y="211" text-anchor="middle" font-size="19" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">通常继承cwd</text><rect x="35" y="245" width="355" height="140" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="212.5" y="279" text-anchor="middle" font-size="23" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">本次Python解释器</text><text x="212.5" y="314" text-anchor="middle" font-size="21" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">实际路径决定所用环境</text><text x="212.5" y="344" text-anchor="middle" font-size="21" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">直接调用 或 激活后核对</text><rect x="455" y="245" width="325" height="140" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="617.5" y="279" text-anchor="middle" font-size="23" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">指定的.py文件</text><text x="617.5" y="314" text-anchor="middle" font-size="21" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">解释器读取并执行</text><text x="617.5" y="344" text-anchor="middle" font-size="21" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">源码放在.venv外</text><path d="M398 315 H445" fill="none" stroke="#85b9ee" stroke-width="3" marker-end="url(#head)"/><text x="422" y="296" text-anchor="middle" font-size="18" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">执行</text><path d="M610 145 V235" fill="none" stroke="#85b9ee" stroke-width="3" marker-end="url(#head)"/><text x="610" y="200" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">解析相对脚本路径</text><rect x="35" y="435" width="745" height="115" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="407.5" y="469" text-anchor="middle" font-size="23" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">怎样确认选对？</text><text x="407.5" y="504" text-anchor="middle" font-size="21" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">Interpreter / Environment应属于目标项目；同版本仍可不同环境。</text></g></svg>
