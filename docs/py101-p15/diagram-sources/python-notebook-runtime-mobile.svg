<svg xmlns="http://www.w3.org/2000/svg" width="340" height="840" viewBox="0 0 340 840" role="img" aria-labelledby="title desc"><title id="title">Notebook四种对象：窄屏关系图</title><desc id="desc">浏览器经Notebook服务器编辑和展示；服务器提供文件与会话服务，与Python内核交互。内核执行代码并保留运行状态；磁盘.ipynb保存代码、说明和可保存输出，不是全部内存。服务器Python和内核Python要分别核验。</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#85b9ee"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#85b9ee"/></marker></defs><rect width="340" height="840" rx="18" fill="#0c1529"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="20" y="15" width="300" height="100" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="170" y="49" text-anchor="middle" font-size="23" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">浏览器</text><text x="170" y="84" text-anchor="middle" font-size="21" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">编辑与展示</text><path d="M170 127 V180" fill="none" stroke="#85b9ee" stroke-width="3" marker-start="url(#back)" marker-end="url(#head)"/><text x="250" y="158" text-anchor="middle" font-size="19" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">操作 / 结果</text><rect x="20" y="195" width="300" height="120" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="170" y="229" text-anchor="middle" font-size="22" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">Notebook服务器</text><text x="170" y="264" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">文件与会话服务</text><text x="170" y="294" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">向内核转交执行请求</text><path d="M100 326 V380 H85 V428" fill="none" stroke="#85b9ee" stroke-width="3" marker-start="url(#back)" marker-end="url(#head)"/><text x="77" y="370" text-anchor="middle" font-size="19" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">打开/保存</text><path d="M240 326 V380 H255 V428" fill="none" stroke="#85b9ee" stroke-width="3" marker-start="url(#back)" marker-end="url(#head)"/><text x="265" y="370" text-anchor="middle" font-size="19" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">执行/返回</text><rect x="10" y="440" width="150" height="185" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="85" y="474" text-anchor="middle" font-size="22" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">.ipynb文件</text><text x="85" y="509" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">代码、说明</text><text x="85" y="539" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">和已保存输出</text><rect x="180" y="440" width="150" height="185" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="255" y="474" text-anchor="middle" font-size="22" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">Python内核</text><text x="255" y="509" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">执行代码</text><text x="255" y="539" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">保留名称与值</text><text x="255" y="569" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">重启清旧状态</text><rect x="10" y="670" width="320" height="155" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="170" y="704" text-anchor="middle" font-size="22" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">分清文件与运行状态</text><text x="170" y="739" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">保存不等于保存全部内存</text><text x="170" y="769" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">服务器Python与内核Python</text><text x="170" y="799" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">要分别核对实际位置</text></g></svg>
