<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700" role="img" aria-labelledby="title desc"><title id="title">浏览器、服务器、内核与Notebook文件</title><desc id="desc">浏览器经Notebook服务器编辑和展示；服务器提供文件与会话服务，与Python内核交互。内核执行代码并保留运行状态；磁盘.ipynb保存代码、说明和可保存输出，不是全部内存。服务器Python和内核Python要分别核验。</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#85b9ee"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#85b9ee"/></marker></defs><rect width="820" height="700" rx="18" fill="#0c1529"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="210" y="20" width="400" height="100" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="410" y="54" text-anchor="middle" font-size="24" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">浏览器</text><text x="410" y="89" text-anchor="middle" font-size="22" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">编辑单元格，展示结果</text><path d="M410 130 V207" fill="none" stroke="#85b9ee" stroke-width="3" marker-start="url(#back)" marker-end="url(#head)"/><text x="535" y="172" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">操作 / 结果</text><rect x="210" y="220" width="400" height="112" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="410" y="254" text-anchor="middle" font-size="23" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">Notebook服务器</text><text x="410" y="289" text-anchor="middle" font-size="21" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">文件、会话服务；转交执行请求</text><path d="M300 343 V409 H205 V462" fill="none" stroke="#85b9ee" stroke-width="3" marker-start="url(#back)" marker-end="url(#head)"/><text x="150" y="398" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">打开 / 保存</text><path d="M520 343 V409 H615 V462" fill="none" stroke="#85b9ee" stroke-width="3" marker-start="url(#back)" marker-end="url(#head)"/><text x="665" y="398" text-anchor="middle" font-size="20" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">执行 / 返回</text><rect x="30" y="475" width="350" height="150" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="205" y="509" text-anchor="middle" font-size="23" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">.ipynb文件（磁盘）</text><text x="205" y="544" text-anchor="middle" font-size="21" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">代码、说明和已保存输出</text><text x="205" y="574" text-anchor="middle" font-size="21" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">保存不等于保存全部内存</text><rect x="440" y="475" width="350" height="150" rx="14" fill="#17243e" stroke="#688fc2" stroke-width="2"/><text x="615" y="509" text-anchor="middle" font-size="23" fill="#9fe9f4" stroke="#0c1529" stroke-width="5" paint-order="stroke">Python内核</text><text x="615" y="544" text-anchor="middle" font-size="21" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">实际执行，保留名称与值</text><text x="615" y="574" text-anchor="middle" font-size="21" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">重启后重新建立运行状态</text><text x="410" y="670" text-anchor="middle" font-size="21" fill="#e8efff" stroke="#0c1529" stroke-width="5" paint-order="stroke">服务器Python与内核Python，要分别核对实际位置。</text></g></svg>
